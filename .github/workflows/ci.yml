name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U app -d app"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip
      - run: pip install .[dev]
      - run: ruff check .
      - run: mypy src
      - run: bandit -r src
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
      - run: pytest
        env:
          DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
