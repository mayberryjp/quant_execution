[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-execution"
version = "0.1.0"
description = "Execution layer of the algo trading platform: consumes price ticks, matches a watchlist, places Alpaca orders, records trades."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "bottle>=0.13",
  "waitress>=3.0",
  "SQLAlchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "confluent-kafka>=2.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "webtest>=3",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --cov=quant_execution --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["quant_execution"]
omit = [
  "src/quant_execution/__main__.py",
  "src/quant_execution/workers/executor.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]


[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# Bottle's route/error decorators are untyped; do not fail strict mode on them.
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["bottle", "waitress", "webtest", "confluent_kafka", "confluent_kafka.*"]
ignore_missing_imports = true
